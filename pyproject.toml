[project]
name = "gauge"
version = "0.1.0"
description = "Turn phone video into verified scientific measurements with Meta's models"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "requests>=2.32",
    "scipy>=1.14",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
